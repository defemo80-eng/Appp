name: Compilar DeiPlay APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK y plataformas
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/Android/Sdk"
            mkdir -p "$SDK_ROOT"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "Instalando Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          SDK_BIN_DIR="$(dirname "$SDKMANAGER_BIN")"
          echo "$SDK_BIN_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || \
          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restaurar o generar debug.keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Creando debug.keystore temporal para CI..."
            rm -f debug.keystore
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android

      - name: Preparar archivo .env
        shell: bash
        env:
          YT_SECRET: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "YOUTUBE_API_KEY=MY_YOUTUBE_API_KEY" > .env
            fi
          fi
          if [ -n "$YT_SECRET" ]; then
            if grep -q '^YOUTUBE_API_KEY=' .env; then
              sed -i "s|^YOUTUBE_API_KEY=.*|YOUTUBE_API_KEY=$YT_SECRET|" .env
            else
              echo "YOUTUBE_API_KEY=$YT_SECRET" >> .env
            fi
          fi

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar Debug APK
        run: ./gradlew :app:assembleDebug -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2 --no-daemon --no-configuration-cache --stacktrace --console=plain

      - name: Preparar DeiPlay.apk
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/*.apk DeiPlay.apk
          ls -lh DeiPlay.apk

      - name: Subir APK compilado (respaldo ZIP sin compresión)
        uses: actions/upload-artifact@v4
        with:
          name: DeiPlay-debug-apk
          path: DeiPlay.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publicar DeiPlay.apk directo en Releases (sin ZIP)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" DeiPlay.apk \
            --title "DeiPlay APK (v1.0.${{ github.run_number }})" \
            --notes "Descarga directa de DeiPlay.apk sin extraer ZIP." \
            --latest

      - name: Ejecutar pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2 --no-daemon --no-configuration-cache --stacktrace --console=plain
